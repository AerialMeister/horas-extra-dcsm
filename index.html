<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Horas Extra · ICETEL</title>
<style>
  :root{--bg:#0f172a;--panel:#fff;--muted:#64748b;--line:#e2e8f0;--primary:#1e3a8f;--primary-d:#16306f;--green:#16a34a;--amber:#d97706;--red:#dc2626;--slate:#475569;--soft:#f1f5f9;--icetel-blue:#1e3a8f;--icetel-red:#d11f2d;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#0f172a}
  header.topbar{background:var(--bg);color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header.topbar .lhs{display:flex;align-items:center;gap:14px}
  header.topbar h1{font-size:15px;margin:0;font-weight:600;color:#e2e8f0}
  header.topbar .who{font-size:13px;color:#cbd5e1;display:flex;align-items:center;gap:14px}
  .badge{background:#1e293b;padding:3px 9px;border-radius:999px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:14px;padding:9px 16px;font-weight:500}
  .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:transparent;color:#e2e8f0;border:1px solid #334155}.btn-ghost:hover{background:#1e293b}
  .btn-green{background:var(--green);color:#fff}.btn-amber{background:var(--amber);color:#fff}.btn-red{background:var(--red);color:#fff}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
  main{max-width:1220px;margin:0 auto;padding:24px 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .login-wrap{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:400px;max-width:100%}
  .login-card h2{margin:6px 0 4px}.login-card p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--slate)}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--primary)}
  .muted{color:var(--muted);font-size:13px}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
  .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  .tab{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--slate);cursor:pointer}
  .tab:hover{border-color:var(--primary);color:var(--primary)}
  .tab.active{background:var(--bg);color:#fff;border-color:var(--bg)}
  .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  @media(max-width:1100px){.cols{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:760px){.cols{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.cols{grid-template-columns:1fr}}
  .col h3{margin:0 0 12px;font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
  .col-count{background:var(--soft);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--slate)}
  .req{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px;background:#fff}
  .req .id{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
  .req .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .req .meta{font-size:12.5px;color:var(--slate);line-height:1.6}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .p-pend{background:#fef9c3;color:#854d0e}.p-appr{background:#dcfce7;color:#166534}
  .p-ret{background:#ffedd5;color:#9a3412}.p-rej{background:#fee2e2;color:#991b1b}
  .req .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .nat-tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:6px;padding:2px 8px;font-size:11px;margin:2px 3px 0 0}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;border:1px dashed var(--line);border-radius:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.row2{grid-template-columns:1fr}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;user-select:none}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .toast{position:fixed;top:18px;right:18px;background:var(--green);color:#fff;padding:13px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:60;max-width:360px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat .n{font-size:26px;font-weight:700}.stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--slate);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .section-title{font-size:15px;font-weight:600;margin:0 0 14px}
  .loader{text-align:center;color:var(--muted);padding:30px}
  .user-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px;margin-bottom:8px}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:14px;padding:22px;width:440px;max-width:100%}
  .approver{font-size:11.5px;color:#166534;background:#dcfce7;border-radius:6px;padding:2px 8px;display:inline-block;margin-top:6px}
</style>
</head>
<body>
<div id="app"><div class="loader">Cargando…</div></div>
<div id="toast-host"></div>
<div id="modal-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ===== CONFIG ===== */
const SB_URL="https://qwhinhcgbquosyvfqpcn.supabase.co";
const SB_KEY="sb_publishable_3tQBewSmAYGtEb3yITHjxg_x_THHnsp";
const SUPER_EMAIL="farredondo@icetel.cl";
const sb=supabase.createClient(SB_URL,SB_KEY);
const AREAS=["Energía","Climatización","Servicios Generales","BMS","Jefatura"];
const NATURALEZAS=["Cobertura de compañero","Solicitudes especiales/Proyectos","Mantenimiento correctivo","Mantenimiento Preventivo","Turno extendido"];
let PERFIL=null;

/* ===== MARCA (texto DCSM) ===== */
function logo(h,color){
  return '<span style="display:inline-flex;align-items:center;height:'+h+'px;font-family:Arial Black,Arial,sans-serif;'+
    'font-weight:900;font-size:'+Math.round(h*0.62)+'px;color:'+(color||"#1e3a8f")+';letter-spacing:2px">DCSM</span>';
}

/* ===== UTIL ===== */
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function toast(m,c){const t=document.createElement("div");t.className="toast";t.textContent=m;if(c)t.style.background=c;document.getElementById("toast-host").appendChild(t);setTimeout(()=>t.remove(),4000);}
function horasDe(r){if(r.horas!=null)return Number(r.horas).toFixed(2);if(!r.hora_inicio||!r.hora_termino)return"";const a=r.hora_inicio.split(":").map(Number),b=r.hora_termino.split(":").map(Number);let m=(b[0]*60+b[1])-(a[0]*60+a[1]);if(m<0)m+=1440;return(m/60).toFixed(2);}
function statusPill(s){const map={pendiente:["Pendiente","p-pend"],aprobada:["Aprobada","p-appr"],devuelta:["Devuelta · corregir","p-ret"],rechazada:["Rechazada","p-rej"]};const x=map[s]||[s,"p-pend"];return '<span class="pill '+x[1]+'">'+x[0]+'</span>';}
function fmtFecha(f){if(!f)return"";var p=(""+f).slice(0,10).split("-");if(p.length<3)return f;return p[2]+"/"+p[1]+"/"+p[0].slice(2);}
function etiquetaMes(sel){var p=(""+sel).split("-"),y=+p[0],m=+p[1];var N=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];return (N[m-1]||"")+" "+y;}
function rango(r){var hi=(r.hora_inicio||"").slice(0,5),hf=(r.hora_termino||"").slice(0,5),ff=r.fecha_fin||r.fecha;var cruza=(ff&&ff!==r.fecha);return fmtFecha(r.fecha)+" "+hi+" → "+(cruza?fmtFecha(ff)+" ":"")+hf;}
/* Período mensual: del 21 del mes anterior al 20 del presente (ambos incluidos).
   Un día 21..fin de mes pertenece al período del mes SIGUIENTE. */
function periodo(fecha){if(!fecha)return"";var p=fecha.split("-"),y=+p[0],m=+p[1],d=+p[2];if(d>=21){m++;if(m>12){m=1;y++;}}return y+"-"+(m<10?"0":"")+m;}
function periodoHoy(){var t=new Date();return periodo(t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"));}
function rangoPeriodo(sel){var p=sel.split("-"),y=+p[0],m=+p[1];var ma=m-1<1?12:m-1, ya=m-1<1?y-1:y;var N=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];return "21 "+N[ma-1]+(ya!==y?" "+ya:"")+" – 20 "+N[m-1]+" "+y;}
function optsHoras(sel){var o='<option value="">--</option>';for(var h=0;h<24;h++){var v=(h<10?"0":"")+h;o+='<option value="'+v+'" '+(v===sel?"selected":"")+'>'+v+'</option>';}return o;}
function optsMin(sel){var o='<option value="">--</option>';for(var m=0;m<60;m++){var v=(m<10?"0":"")+m;o+='<option value="'+v+'" '+(v===sel?"selected":"")+'>'+v+'</option>';}return o;}
function pickerHora(prefix,fecha,hh,mm){
  return '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">'+
    '<input type="date" id="'+prefix+'_d" value="'+(fecha||"")+'" style="flex:1;min-width:150px">'+
    '<select id="'+prefix+'_h" style="width:auto">'+optsHoras(hh||"")+'</select>'+
    '<span style="font-weight:700">:</span>'+
    '<select id="'+prefix+'_m" style="width:auto">'+optsMin(mm||"")+'</select>'+
    '<span class="muted" style="font-size:12px">hrs</span></div>';
}
function genCodigo(){return "HE-"+new Date().getFullYear()+"-"+String(Date.now()).slice(-6);}
function isSuper(){return PERFIL && PERFIL.rol==="superadmin";}
function isAdmin(){return PERFIL && (PERFIL.rol==="admin"||PERFIL.rol==="superadmin");}

/* ===== AUTH ===== */
async function init(){
  const {data}=await sb.auth.getSession();
  if(data.session){await loadPerfil();route();}else renderLogin();
}
async function loadPerfil(){
  const u=(await sb.auth.getUser()).data.user;
  const {data}=await sb.from("perfiles").select("*").eq("id",u.id).single();
  PERFIL=data||{id:u.id,email:u.email,nombre:u.email,rol:"solicitante",area:AREAS[0]};
}
function renderLogin(){
  document.getElementById("app").innerHTML=
   '<div class="login-wrap"><div class="card login-card">'+
   '<div style="display:flex;justify-content:center;margin-bottom:6px">'+logo(54)+'</div>'+
   '<h2 style="text-align:center">Control de Horas Extra</h2><p class="sub" style="text-align:center">Inicia sesión para continuar</p>'+
   '<label>Email</label><input id="lu" type="email" placeholder="nombre@icetel.cl">'+
   '<label>Contraseña</label><input id="lp" type="password" placeholder="••••••">'+
   '<div class="err" id="lerr"></div>'+
   '<button class="btn-primary" style="width:100%;margin-top:12px" onclick="doLogin()">Ingresar</button>'+
   '<p class="muted" style="text-align:center;margin-top:14px;font-size:12px">Las cuentas las crea el administrador. Si necesitas acceso, solicítalo a '+SUPER_EMAIL+'.</p>'+
   '</div></div>';
  document.getElementById("lp").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
}
async function doLogin(){
  const email=document.getElementById("lu").value.trim(),password=document.getElementById("lp").value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById("lerr").textContent=error.message;return;}
  await loadPerfil();route();
}
async function logout(){await sb.auth.signOut();PERFIL=null;renderLogin();}

function topbar(sub){
  return '<header class="topbar"><div class="lhs">'+logo(30,"#fff")+'<h1>Control de Horas Extra · '+sub+'</h1></div>'+
   '<div class="who"><span class="badge">'+(PERFIL.rol==="superadmin"?"Super usuario":PERFIL.rol==="admin"?"Supervisor":"Solicitante")+'</span>'+
   '<span>'+esc(PERFIL.nombre)+(PERFIL.area?" · "+PERFIL.area:"")+'</span>'+
   '<button class="btn-ghost btn-sm" onclick="logout()">Salir</button></div></header>';
}

/* ===== MODAL COMENTARIO OBLIGATORIO ===== */
function askComment(titulo,etiqueta){
  return new Promise(res=>{
    const host=document.getElementById("modal-host");
    host.innerHTML='<div class="modal-bg"><div class="modal">'+
      '<p class="section-title">'+titulo+'</p>'+
      '<label>'+etiqueta+' <span style="color:var(--red)">*</span></label>'+
      '<textarea id="mc" rows="4" placeholder="Escribe el motivo (obligatorio)…"></textarea>'+
      '<div class="err" id="mcerr"></div>'+
      '<div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end">'+
      '<button class="btn-ghost" style="color:#475569;border-color:#cbd5e1" id="mcancel">Cancelar</button>'+
      '<button class="btn-primary" id="mok">Confirmar</button></div></div></div>';
    const close=v=>{host.innerHTML="";res(v);};
    document.getElementById("mcancel").onclick=()=>close(null);
    document.getElementById("mok").onclick=()=>{const v=document.getElementById("mc").value.trim();if(!v){document.getElementById("mcerr").textContent="El comentario es obligatorio.";return;}close(v);};
    document.getElementById("mc").focus();
  });
}

/* ===== ROUTER ===== */
function route(){if(!PERFIL)return renderLogin();if(PERFIL.debe_cambiar_clave)return renderCambioClave();isAdmin()?renderAdmin():renderUser();}
function renderCambioClave(){
  document.getElementById("app").innerHTML=
   '<div class="login-wrap"><div class="card login-card">'+
   '<div style="display:flex;justify-content:center;margin-bottom:6px">'+logo(54)+'</div>'+
   '<h2 style="text-align:center">Define tu nueva contraseña</h2>'+
   '<p class="sub" style="text-align:center">Tu administrador reseteó tu acceso. Crea una contraseña nueva para continuar.</p>'+
   '<label>Nueva contraseña</label><input id="np1" type="password" placeholder="••••••">'+
   '<label>Confirmar contraseña</label><input id="np2" type="password" placeholder="••••••">'+
   '<div class="err" id="nperr"></div>'+
   '<button class="btn-primary" style="width:100%;margin-top:12px" onclick="guardarNuevaClave()">Guardar y entrar</button>'+
   '<div style="text-align:center;margin-top:10px"><button class="btn-link" style="background:none;color:var(--primary);padding:4px;font-size:13px" onclick="logout()">Cancelar y salir</button></div>'+
   '</div></div>';
}
async function guardarNuevaClave(){
  const p1=document.getElementById("np1").value,p2=document.getElementById("np2").value,err=document.getElementById("nperr");
  if(p1.length<6){err.textContent="La contraseña debe tener al menos 6 caracteres.";return;}
  if(p1!==p2){err.textContent="Las contraseñas no coinciden.";return;}
  const {error}=await sb.auth.updateUser({password:p1});
  if(error){err.textContent=error.message;return;}
  await sb.rpc("marcar_clave_cambiada");
  PERFIL.debe_cambiar_clave=false;
  toast("Contraseña actualizada ✓");route();
}

/* ===== SOLICITANTE (y supervisores que crean) ===== */
let userTab="bandeja",editing=null,_editRow=null,SOLCTX="user";
function areaSol(){return PERFIL && PERFIL.rol==="admin" ? "Jefatura" : (PERFIL?PERFIL.area:"");}
function contId(){return SOLCTX==="admin"?"abody":"ubody";}
function refreshSol(){SOLCTX==="admin"?renderAdmin():renderUser();}
function volverBandeja(){editing=null;if(SOLCTX==="admin"){adminTab="mis";renderAdmin();}else{userTab="bandeja";renderUser();}}
function setUserTab(t){userTab=t;renderUser();}
async function renderUser(){
  SOLCTX="user";
  document.getElementById("app").innerHTML=topbar("Solicitante")+'<main>'+
   '<div class="tabs"><div class="tab '+(userTab==='bandeja'?'active':'')+'" onclick="setUserTab(\'bandeja\')">📥 Mis solicitudes</div>'+
   '<div class="tab '+(userTab==='nueva'?'active':'')+'" onclick="setUserTab(\'nueva\')">＋ Crear nueva solicitud</div></div>'+
   '<div id="ubody"><div class="loader">Cargando…</div></div></main>';
  userTab==='nueva'?renderForm():await renderUserInbox();
}
async function renderUserInbox(){
  const {data:mine,error}=await sb.from("solicitudes").select("*").eq("solicitante",PERFIL.id).order("creado_en",{ascending:false});
  if(error){document.getElementById("ubody").innerHTML='<div class="card err">'+error.message+'</div>';return;}
  const all=mine||[];
  const curM=periodoHoy();
  const months=Array.from(new Set(all.map(r=>periodo(r.fecha)).filter(Boolean)));
  if(months.indexOf(curM)<0)months.push(curM);
  months.sort().reverse();
  const sel=window._umes||curM;window._umes=sel;
  const inM=all.filter(r=>periodo(r.fecha)===sel);
  const g={pendiente:[],devuelta:[],aprobada:[],rechazada:[]};inM.forEach(r=>{if(g[r.estado])g[r.estado].push(r);});
  const horasApr=g.aprobada.reduce((a,r)=>a+parseFloat(horasDe(r)||0),0);
  const mesLabel=(()=>{const [y,m]=sel.split("-");return ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][parseInt(m,10)-1]+" "+y;})();
  const opts=months.map(m=>'<option value="'+m+'" '+(m===sel?'selected':'')+'>'+etiquetaMes(m)+'</option>').join("");
  const filtro='<div class="card" style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">'+
    '<p class="section-title" style="margin:0">Mis solicitudes · '+mesLabel+' <span class="muted" style="font-weight:400">('+rangoPeriodo(sel)+')</span></p>'+
    '<div style="display:flex;align-items:center;gap:10px"><label style="margin:0">Consultar mes</label>'+
    '<select style="width:auto" onchange="window._umes=this.value;refreshSol()">'+opts+'</select></div></div>';
  const indic='<div class="stat-grid">'+
    '<div class="stat"><div class="n" style="color:var(--green)">'+horasApr.toFixed(1)+' h</div><div class="l">Horas aprobadas (mes)</div></div>'+
    '<div class="stat"><div class="n">'+inM.length+'</div><div class="l">Solicitudes totales (mes)</div></div>'+
    '<div class="stat"><div class="n" style="color:var(--amber)">'+g.pendiente.length+'</div><div class="l">En curso (pendientes)</div></div></div>';
  const block=(t,a,n)=>'<div class="card" style="margin-bottom:16px"><p class="section-title">'+t+' <span class="col-count">'+a.length+'</span></p>'+(n?'<p class="muted" style="margin-top:-8px">'+n+'</p>':"")+(a.length?a.map(userCard).join(""):'<div class="empty">Sin solicitudes este mes</div>')+'</div>';
  document.getElementById(contId()).innerHTML=
   filtro+indic+
   block("⏳ En curso (pendiente de aprobación)",g.pendiente,"Esperando revisión del supervisor.")+
   block("↩️ Devueltas — debes corregir",g.devuelta,"Edita según el comentario y reenvía.")+
   block("✅ Aprobadas",g.aprobada,"")+block("⛔ Rechazadas",g.rechazada,"");
}
function userCard(r){
  const nat=(r.naturaleza||[]).map(n=>'<span class="nat-tag">'+esc(n)+'</span>').join("");
  const com=r.comentario?'<div style="margin-top:8px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:9px 11px;font-size:12.5px"><b>Comentario del supervisor:</b><br>'+esc(r.comentario)+'</div>':"";
  const apr=(r.estado==="aprobada"&&r.decidido_por_email)?'<div class="approver">✔ Autorizada por '+esc(r.decidido_por_email)+'</div>':"";
  const acts=r.estado==="devuelta"?'<div class="acts"><button class="btn-primary btn-sm" onclick="editReq('+r.id+')">Corregir y reenviar</button></div>':"";
  return '<div class="req"><div class="top"><span class="id">'+esc(r.codigo)+'</span>'+statusPill(r.estado)+'</div>'+
   '<div class="meta">🕒 '+rango(r)+' ('+horasDe(r)+' h) · Área: '+esc(r.area)+'</div>'+
   '<div style="margin-top:6px">'+nat+'</div>'+(r.detalles?'<div class="meta" style="margin-top:6px">📝 '+esc(r.detalles)+'</div>':"")+com+apr+acts+'</div>';
}
async function editReq(id){const {data}=await sb.from("solicitudes").select("*").eq("id",id).single();_editRow=data;editing=id;if(SOLCTX==="admin"){adminTab="crear";renderAdmin();}else{userTab="nueva";renderUser();}}
function renderForm(){
  const r=editing?_editRow:null,sel=r?(r.naturaleza||[]):[];
  document.getElementById(contId()).innerHTML=

async function submitForm(){
  const v=function(id){return document.getElementById(id).value;};
  const iniD=v("f_ini_d"),iniH=v("f_ini_h"),iniM=v("f_ini_m");
  const finD=v("f_fin_d"),finH=v("f_fin_h"),finM=v("f_fin_m");
  const nat=[].slice.call(document.querySelectorAll("#f_nat .chip.on")).map(c=>c.dataset.v);
  const det=document.getElementById("f_det").value.trim(),err=document.getElementById("ferr");
  if(!iniD||iniH===""||iniM===""){err.textContent="Completa el día y la hora de inicio.";return;}
  if(!finD||finH===""||finM===""){err.textContent="Completa el día y la hora de término.";return;}
  const iniV=iniD+"T"+iniH+":"+iniM,finV=finD+"T"+finH+":"+finM;
  if(new Date(finV)<=new Date(iniV)){err.textContent="El término debe ser posterior al inicio.";return;}
  if(!nat.length){err.textContent="Selecciona al menos una naturaleza.";return;}
  const fecha=iniD,ini=iniH+":"+iniM;
  const fechaFin=finD,fin=finH+":"+finM;
  if(editing){
    const {error}=await sb.from("solicitudes").update({fecha,fecha_fin:fechaFin,hora_inicio:ini,hora_termino:fin,naturaleza:nat,detalles:det,estado:"pendiente",comentario:null,actualizado_en:new Date().toISOString()}).eq("id",editing);
    if(error){err.textContent=error.message;return;}
    notificar(editing);toast("Solicitud corregida y reenviada ✓");
  }else{
    const codigo=genCodigo();
    const {data:ins,error}=await sb.from("solicitudes").insert({codigo,solicitante:PERFIL.id,area:areaSol(),fecha,fecha_fin:fechaFin,hora_inicio:ini,hora_termino:fin,naturaleza:nat,detalles:det,estado:"pendiente"}).select("id").single();
    if(error){err.textContent=error.message;return;}
    if(ins)notificar(ins.id);toast("✓ Solicitud enviada · ID: "+codigo);
  }
  volverBandeja();
}

  try{ await sb.functions.invoke("notificar-solicitud",{body:{id:id}}); }
  catch(e){ console.warn("No se pudo notificar:",e); }
}

  if(estado==="rechazada"){comentario=await askComment("Rechazar solicitud","Motivo del rechazo");if(comentario===null)return;}
  const {data:row}=await sb.from("solicitudes").select("*").eq("id",id).single();
  await sb.from("eventos_solicitud").insert({codigo:row.codigo,solicitante:row.solicitante,area:row.area,estado:estado,horas:row.horas,comentario:comentario,decidido_por:PERFIL.id,decidido_por_email:PERFIL.email});
  const upd={estado:estado,comentario:comentario,decidido_por:PERFIL.id,decidido_por_email:PERFIL.email,actualizado_en:new Date().toISOString()};

async function exportXLSX(){
  const apr=window._aprCache||[];
  if(!window.ExcelJS){toast("No se pudo cargar el generador de Excel. Reintenta.","#dc2626");return;}
  if(!apr.length){toast("No hay aprobadas en este período para exportar.","#d97706");return;}
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("Horas extra");
  ws.columns=[
    {header:"Proyecto",key:"proyecto",width:12},
    {header:"Área",key:"area",width:18},
    {header:"Fecha horas extra",key:"fecha",width:16},
    {header:"Nombre",key:"nombre",width:24},
    {header:"Rut",key:"rut",width:14},
    {header:"Detalle de hora extra",key:"detalle",width:40},
    {header:"Tipo de actividad",key:"tipo",width:28},
    {header:"Inicio",key:"inicio",width:18},
    {header:"Fin",key:"fin",width:18},
    {header:"N° horas",key:"horas",width:10},
    {header:"Aprobador",key:"aprobador",width:26}
  ];
  apr.forEach(r=>ws.addRow({
    proyecto:"DCSM",area:r.area,fecha:fmtFecha(r.fecha),
    nombre:(r.perfiles&&r.perfiles.nombre)||"",rut:rutDe(r),
    detalle:r.detalles||"",tipo:(r.naturaleza||[]).join(", "),
    inicio:fmtFecha(r.fecha)+" "+(r.hora_inicio||"").slice(0,5),
    fin:fmtFecha(r.fecha_fin||r.fecha)+" "+(r.hora_termino||"").slice(0,5),
    horas:Number(horasDe(r))||0,aprobador:r.decidido_por_email||""
  }));
  const hr=ws.getRow(1);hr.height=24;
  hr.eachCell(c=>{c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1E3A8F"}};c.font={bold:true,color:{argb:"FFFFFFFF"},size:11};c.alignment={vertical:"middle",horizontal:"center",wrapText:true};c.border={top:{style:"thin",color:{argb:"FFBFC8E0"}},bottom:{style:"thin",color:{argb:"FFBFC8E0"}},left:{style:"thin",color:{argb:"FFBFC8E0"}},right:{style:"thin",color:{argb:"FFBFC8E0"}}};});
  for(var i=2;i<=ws.rowCount;i++){var row=ws.getRow(i);var zebra=(i%2===0);row.eachCell(c=>{c.alignment={vertical:"middle",wrapText:true};c.border={top:{style:"hair",color:{argb:"FFE2E8F0"}},bottom:{style:"hair",color:{argb:"FFE2E8F0"}},left:{style:"hair",color:{argb:"FFE2E8F0"}},right:{style:"hair",color:{argb:"FFE2E8F0"}}};if(zebra)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF1F5F9"}};});}
  ws.views=[{state:"frozen",ySplit:1}];
  ws.autoFilter={from:"A1",to:"K1"};
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="HorasExtra-DCSM-"+(window._mes||"")+".xlsx";a.click();
}

  const nombre=document.getElementById("nu_name").value.trim(),rol=document.getElementById("nu_rol").value,area=document.getElementById("nu_area").value;

  const rut=document.getElementById("nu_rut").value.trim();

    '<label>Nombre completo</label><input id="ed_name" value="'+esc(u.nombre||"")+'">'+
    '<label>Tipo de cuenta</label><select id="ed_rol" onchange="document.getElementById(\'ed_area_wrap\').style.display=this.value===\'admin\'?\'none\':\'block\'">'+
      '<option value="solicitante" '+(u.rol==="solicitante"?"selected":"")+'>Solicitante</option>'+
      '<option value="admin" '+(u.rol==="admin"?"selected":"")+'>Supervisor</option></select>'+
    '<div id="ed_area_wrap" style="display:'+(u.rol==="admin"?"none":"block")+'"><label>Área</label><select id="ed_area">'+AREAS.map(a=>'<option '+(a===u.area?"selected":"")+'>'+a+'</option>').join("")+'</select></div>'+
    '<label>RUT</label><input id="ed_rut" value="'+esc(u.rut||"")+'" placeholder="12.345.678-9">'+
    '<div class="err" id="ederr"></div>'+
    '<div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end">'+
    '<button class="btn-ghost" style="color:#475569;border-color:#cbd5e1" onclick="document.getElementById(\'modal-host\').innerHTML=\'\'">Cancelar</button>'+
    '<button class="btn-primary" onclick="guardarEdicion(\''+uid+'\')">Guardar</button></div></div></div>';
}
async function guardarEdicion(uid){
  const nombre=document.getElementById("ed_name").value.trim();
  const rol=document.getElementById("ed_rol").value;
  const area=rol==="admin"?null:document.getElementById("ed_area").value;
  const rut=document.getElementById("ed_rut").value.trim()||null;
  const err=document.getElementById("ederr");
  if(!nombre){err.textContent="El nombre es obligatorio.";return;}
  const {error}=await sb.rpc("editar_perfil",{uid:uid,nuevo_nombre:nombre,nuevo_rol:rol,nueva_area:area,nuevo_rut:rut});
  if(error){err.textContent=error.message;return;}
  document.getElementById("modal-host").innerHTML="";
  toast("Cuenta actualizada ✓");renderCuentas();
}
async function eliminarCuenta(uid,email){
  if(!confirm("¿Eliminar definitivamente la cuenta "+email+"? Esta acción no se puede deshacer. El historial de horas se conserva, pero la persona dejará de aparecer como solicitante."))return;
  const {error}=await sb.rpc("eliminar_cuenta",{uid:uid});
  if(error){toast("No se pudo eliminar: "+error.message,"#dc2626");return;}
  toast("Cuenta eliminada ✓");renderCuentas();
}
async function resetClave(userId,email){
  if(!confirm("¿Resetear la clave de "+email+"? Se generará una clave temporal y la persona deberá definir una nueva al ingresar."))return;
  const temp="Dcsm-"+Math.random().toString(36).slice(2,8);
  const {data,error}=await sb.functions.invoke("reset-clave",{body:{userId:userId,tempPassword:temp}});
  if(error){toast("No se pudo resetear: "+(error.message||error),"#dc2626");return;}
  if(data&&data.error){toast(data.error,"#dc2626");return;}
  infoModal("Clave reseteada para "+esc(email),
    "Entrégale esta <b>clave temporal</b> a la persona. Al iniciar sesión, el sistema le pedirá crear una contraseña nueva."+
    '<div style="margin-top:10px;font-family:ui-monospace,monospace;font-size:18px;background:var(--soft);padding:10px;border-radius:8px;text-align:center;user-select:all">'+esc(temp)+'</div>');
}

init();
</script>
</body>
</html>
